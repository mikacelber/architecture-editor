<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Architecture Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Theme lives in Project Options → General now — read it before first paint
  // so the page never flashes the wrong colors. Dark is the default.
  try { document.documentElement.dataset.theme = localStorage.getItem('ui_theme')==='light' ? 'light' : 'dark'; }
  catch(e){ document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>

<header>
  <img src="nexodesign_logo.jpg" alt="NX Design" class="brand-logo" onerror="this.style.display='none'">
  <div class="brand">
    <span class="eyebrow">Block architecture · pipeline stage 0</span>
    <h1 id="projTitle">Untitled system</h1>
  </div>
  <div class="spacer"></div>
  <button id="btnUndo" title="Undo (Ctrl+Z)" disabled>&#8630;</button>
  <button id="btnRedo" title="Redo (Ctrl+Y)" disabled>&#8631;</button>
  <button id="btnLayout" title="Recompute deterministic layout">Auto-layout</button>
  <button id="btnAutoIC" title="Assign every IC without a selected part the cheapest offer found on the enabled distributors">Auto IC Selection</button>
  <button id="btnAddIC">Add IC</button>
  <button id="btnAddExt">Add External</button>
  <button id="btnImport">Import</button>
  <button id="btnExport" class="primary">Export</button>
</header>

<main>
  <div id="canvasWrap">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="legend"></div>
    <!-- Collapse/expand handle, centred on the divider: a slim block that
         interrupts the line. The arrow is three near-vertical strokes bent
         into a chevron (no shaft) — right = fold the panel away, and the
         same block stays at the edge, mirrored, to bring it back. -->
    <button id="inspHandle" title="Hide the inspector panel">
      <svg viewBox="0 0 12 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="2.2,4 5.2,20 2.2,36"/>
        <polyline points="5.4,8 7.9,20 5.4,32"/>
        <polyline points="8.6,12 10.6,20 8.6,28"/>
      </svg>
    </button>
    <svg id="board" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- markerUnits="userSpaceOnUse" pins the arrowhead to a fixed pixel size —
             it never scales with a wire's stroke-width, so every signal category
             (differentiated by color/dash only, see NET_CATEGORY_STYLE in app.js)
             gets an identically sized arrow. -->
        <marker id="arrowHv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9.5" markerHeight="9.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-hv)"/>
        </marker>
        <marker id="arrowPower" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9.5" markerHeight="9.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-power)"/>
        </marker>
        <marker id="arrowControl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9.5" markerHeight="9.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-control)"/>
        </marker>
        <marker id="arrowLogic" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9.5" markerHeight="9.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-logic)"/>
        </marker>
        <marker id="arrowAnalog" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9.5" markerHeight="9.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-analog)"/>
        </marker>
        <marker id="arrowSwitching" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9.5" markerHeight="9.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-switching)"/>
        </marker>
        <marker id="arrowOther" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9.5" markerHeight="9.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-other)"/>
        </marker>
        <!-- A net in error (one crossing two isolation areas) drops its category
             styling for this one: warning yellow, dotted and thicker. -->
        <marker id="arrowWarn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--warn)"/>
        </marker>
      </defs>
      <!-- Plain pan-capture surface. The ONLY grid is the adaptive one in #gridG,
           drawn in screen space and kept aligned to the world lattice by app.js. -->
      <rect id="bg" x="-100000" y="-100000" width="200000" height="200000" fill="var(--paper)"/>
      <g id="gridG"></g>
      <g id="viewport">
        <g id="edgesG"></g>
        <g id="linkPreviewG"></g>
        <g id="nodesG"></g>
      </g>
    </svg>

    <!-- Empty sheet: nothing is loaded at boot, so the canvas offers the two
         actions that make sense — a "+" card that opens Import, and a blank-
         page card that starts a diagram from scratch. Hidden as soon as the
         diagram has blocks or scratch mode began (see renderEmptyState). -->
    <div id="emptyState" hidden>
      <div class="es-actions">
        <div class="es-choice">
          <button id="emptyAdd" title="Import a system JSON or a saved session">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
              <line x1="24" y1="12" x2="24" y2="36"/>
              <line x1="12" y1="24" x2="36" y2="24"/>
            </svg>
          </button>
          <p class="es-cap" data-k="imp">Import</p>
        </div>
        <div class="es-choice">
          <button id="emptyBlank" title="Start a new empty diagram and add ICs by hand">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 8 h14 l8 8 v24 h-22 Z"/>
              <polyline points="28,8 28,16 36,16"/>
            </svg>
          </button>
          <p class="es-cap" data-k="new">Start from scratch</p>
        </div>
      </div>
      <p class="es-title">No system loaded</p>
      <p class="es-hint">Click <b>+</b> to import a system JSON or a saved session — or start from scratch and build the diagram by hand.</p>
    </div>

    <!-- View controls, bottom-right of the sheet: zoom out / zoom in / fit.
         Icons only — each one names itself on hover. -->
    <div id="viewTools">
      <button id="btnZoomIn" title="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <line x1="15.4" y1="15.4" x2="20.5" y2="20.5"/>
          <line x1="7.5" y1="10.5" x2="13.5" y2="10.5"/>
          <line x1="10.5" y1="7.5" x2="10.5" y2="13.5"/>
        </svg>
      </button>
      <button id="btnZoomOut" title="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <line x1="15.4" y1="15.4" x2="20.5" y2="20.5"/>
          <line x1="7.5" y1="10.5" x2="13.5" y2="10.5"/>
        </svg>
      </button>
      <button id="btnZoomFit" title="Fit diagram to view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3,8 3,3 8,3"/>
          <polyline points="16,3 21,3 21,8"/>
          <polyline points="21,16 21,21 16,21"/>
          <polyline points="8,21 3,21 3,16"/>
          <rect x="7.5" y="7.5" width="9" height="9" rx="1"/>
        </svg>
      </button>
    </div>
  </div>

  <aside id="inspector">
    <div id="inspResize" title="Drag to resize the panel"></div>
    <button id="inspPin" class="pinned" title="Unpin — the panel hides itself to maximize the diagram">
      <!-- Altium-style thumbtack: head, collar, needle -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3 h6 l-1 6 3 3 H7 l3 -3 Z" fill="currentColor" fill-opacity=".25"/>
        <line x1="12" y1="12" x2="12" y2="20"/>
      </svg>
    </button>
    <div class="head">
      <span class="eyebrow" id="insEyebrow">Inspector</span>
      <h2 id="insTitle">Nothing selected</h2>
    </div>
    <div class="body" id="insBody"></div>
  </aside>
</main>

<footer id="statusBar"></footer>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <div class="mhead"><h3 id="modalTitle"></h3><div class="spacer"></div><button id="modalClose">✕</button></div>
    <div class="mbody" id="modalBody"></div>
    <div class="mfoot" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- Vendored PDF engine (Export → PDF drawing). jsPDF writes the document,
     svg2pdf converts each sheet's live SVG into vector page content. -->
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/svg2pdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
