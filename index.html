<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Architecture Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Dark by default (session-only, no persistence) — the header toggle can still switch to light.
  document.documentElement.dataset.theme = 'dark';
</script>
</head>
<body>

<header>
  <img src="nexodesign_logo.jpg" alt="NX Design" class="brand-logo" onerror="this.style.display='none'">
  <div class="brand">
    <span class="eyebrow">Block architecture · pipeline stage 0</span>
    <h1 id="projTitle">Untitled system</h1>
  </div>
  <div class="spacer"></div>
  <button id="btnUndo" title="Undo (Ctrl+Z)" disabled>&#8630;</button>
  <button id="btnRedo" title="Redo (Ctrl+Y)" disabled>&#8631;</button>
  <button id="btnTheme" title="Toggle light/dark theme">Dark</button>
  <button id="btnLayout" title="Recompute deterministic layout">Auto-layout</button>
  <button id="btnFit" title="Fit diagram to view">Fit view</button>
  <button id="btnAddIC">Add IC</button>
  <button id="btnAddExt">Add External</button>
  <button id="btnImport">Import</button>
  <button id="btnExport" class="primary">Export</button>
</header>

<main>
  <div id="canvasWrap">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="legend"></div>
    <button id="inspTab" title="Show the inspector panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3 h6 l-1 6 3 3 H7 l3 -3 Z" fill="currentColor" fill-opacity=".25"/>
        <line x1="12" y1="12" x2="12" y2="20"/>
      </svg>
    </button>
    <svg id="board" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- markerUnits="userSpaceOnUse" pins the arrowhead to a fixed pixel size —
             it never scales with a wire's stroke-width, so every signal category
             (differentiated by color/dash only, see NET_CATEGORY_STYLE in app.js)
             gets an identically sized arrow. -->
        <marker id="arrowHv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-hv)"/>
        </marker>
        <marker id="arrowPower" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-power)"/>
        </marker>
        <marker id="arrowControl" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-control)"/>
        </marker>
        <marker id="arrowLogic" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-logic)"/>
        </marker>
        <marker id="arrowAnalog" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-analog)"/>
        </marker>
        <marker id="arrowSwitching" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-switching)"/>
        </marker>
        <marker id="arrowOther" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--sig-other)"/>
        </marker>
      </defs>
      <!-- Plain pan-capture surface. The ONLY grid is the adaptive one in #gridG,
           drawn in screen space and kept aligned to the world lattice by app.js. -->
      <rect id="bg" x="-100000" y="-100000" width="200000" height="200000" fill="var(--paper)"/>
      <g id="gridG"></g>
      <g id="viewport">
        <g id="edgesG"></g>
        <g id="linkPreviewG"></g>
        <g id="nodesG"></g>
      </g>
    </svg>
  </div>

  <aside id="inspector">
    <div id="inspResize" title="Drag to resize the panel"></div>
    <button id="inspPin" class="pinned" title="Unpin — the panel hides itself to maximize the diagram">
      <!-- Altium-style thumbtack: head, collar, needle -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3 h6 l-1 6 3 3 H7 l3 -3 Z" fill="currentColor" fill-opacity=".25"/>
        <line x1="12" y1="12" x2="12" y2="20"/>
      </svg>
    </button>
    <div class="head">
      <span class="eyebrow" id="insEyebrow">Inspector</span>
      <h2 id="insTitle">Nothing selected</h2>
    </div>
    <div class="body" id="insBody"></div>
  </aside>
</main>

<footer id="statusBar"></footer>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <div class="mhead"><h3 id="modalTitle"></h3><div class="spacer"></div><button id="modalClose">✕</button></div>
    <div class="mbody" id="modalBody"></div>
    <div class="mfoot" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
