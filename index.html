<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Architecture Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Set before first paint to avoid a flash of the wrong theme; no persistence (session-only),
  // just an initial guess from the OS preference that the header toggle can override.
  document.documentElement.dataset.theme =
    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
</head>
<body>

<header>
  <img src="nexodesign_logo.jpg" alt="NX Design" class="brand-logo">
  <div class="brand">
    <span class="eyebrow">Block architecture · pipeline stage 0</span>
    <h1 id="projTitle">Untitled system</h1>
  </div>
  <div class="spacer"></div>
  <button id="btnTheme" title="Toggle light/dark theme">Dark</button>
  <button id="btnLayout" title="Recompute deterministic layout">Auto-layout</button>
  <button id="btnFit" title="Fit diagram to view">Fit view</button>
  <button id="btnAddIC">Add IC</button>
  <button id="btnImport">Import</button>
  <button id="btnExport" class="primary">Export</button>
</header>

<main>
  <div id="canvasWrap">
    <div class="breadcrumb" id="breadcrumb"></div>
    <svg id="board" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridSm" width="16" height="16" patternUnits="userSpaceOnUse">
          <path d="M16 0H0V16" fill="none" stroke="var(--grid)" stroke-width="1"/>
        </pattern>
        <pattern id="gridLg" width="80" height="80" patternUnits="userSpaceOnUse">
          <rect width="80" height="80" fill="url(#gridSm)"/>
          <path d="M80 0H0V80" fill="none" stroke="var(--grid-major)" stroke-width="1.4"/>
        </pattern>
        <marker id="arrowCopper" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--copper)"/>
        </marker>
        <marker id="arrowHv" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0.6 L7.4 4 L0 7.4 Z" fill="var(--hv)"/>
        </marker>
      </defs>
      <rect id="bg" x="-100000" y="-100000" width="200000" height="200000" fill="url(#gridLg)"/>
      <g id="viewport">
        <g id="edgesG"></g>
        <g id="linkPreviewG"></g>
        <g id="nodesG"></g>
      </g>
    </svg>
  </div>

  <aside id="inspector">
    <div class="head">
      <span class="eyebrow" id="insEyebrow">Inspector</span>
      <h2 id="insTitle">Nothing selected</h2>
    </div>
    <div class="body" id="insBody"></div>
  </aside>
</main>

<footer id="statusBar"></footer>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <div class="mhead"><h3 id="modalTitle"></h3><div class="spacer"></div><button id="modalClose">✕</button></div>
    <div class="mbody" id="modalBody"></div>
    <div class="mfoot" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
